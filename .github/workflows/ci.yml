name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4" "mypy>=1.9" "homeassistant==2026.9.2"

      # Same file list as SOURCES in deploy_to_ha.py, so the local gate can
      # never be weaker than CI.
      - name: Ruff lint
        run: ruff check custom_components/ tests/ upload_to_ha.py deploy_to_ha.py verify_live.py

      - name: Ruff format check
        run: ruff format --check custom_components/ tests/ upload_to_ha.py deploy_to_ha.py verify_live.py

      # Not `|| true`: this gate was previously disabled and let 29 type errors
      # accumulate, including the real "callable | None" and DeviceInfo bugs.
      - name: Mypy
        run: mypy custom_components/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The integration imports Home Assistant itself, so the tests need HA
      # installed. `[test]` pins the HA version the integration is built for.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Test with pytest
        run: pytest tests/ --cov=custom_components/ --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
