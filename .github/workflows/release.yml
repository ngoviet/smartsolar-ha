name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          MANIFEST_VER=$(python -c "import json; print(json.load(open('custom_components/smartsolar_ha/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST_VER" ]; then
            echo "Tag version v$TAG does not match manifest version $MANIFEST_VER"
            exit 1
          fi
          echo "Version $TAG validated"

      # The release body comes from GitHub's own generated notes. An earlier
      # revision piped a `mikepenz/release-changelog-builder-action` config
      # containing "${{CHANGELOG}}" through `with:`, which GitHub rejects while
      # parsing the workflow ("undefined variable CHANGELOG"). That made every
      # tag push end in a startup failure with no jobs, so no release was ever
      # published by this workflow.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
