[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[project]
name = "smartsolar_ha"
version = "2.0.6"
description = "Home Assistant custom integration for SmartSolar MPPT solar charge controllers"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ngoviet", email = "ngoviet@github.com"}
]
# Home Assistant 2026.x declares `Requires-Python: >=3.14.2`, so the
# integration cannot run on an older interpreter either.
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.8.0",
    "aiomqtt>=2.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
# Floors are the versions the gate is verified with. They used to be older than
# the code they have to parse: `ruff>=0.4` cannot read the
# `target-version = "py314"` line below at all (it exits 2 with a TOML parse
# error) and predates PEP 758, and `mypy>=1.9` reports 5 errors on the very
# sources `mypy 2.x` accepts — so an environment that honoured the floor could
# never go green.
dev = [
    "pytest>=8.0",
    # asyncio_default_fixture_loop_scope / asyncio_default_test_loop_scope are
    # set below and only exist from pytest-asyncio 1.0.
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=2.3",
]

# The tests import the integration, which imports Home Assistant itself.
# `homeassistant` must match the target HA version because the integration is
# developed against HA internals (DataUpdateCoordinator, registries, ...).
# It is pinned to the version the live instance runs (2026.9.4); a pin that
# trails it would test against Home Assistant code no longer in production.
# Home Assistant 2026.x requires Python >= 3.14.2.
test = [
    "homeassistant==2026.9.4",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
]

# Only needed for the SSH deploy/verify scripts (deploy_to_ha.py, upload_to_ha.py).
# They import paramiko at module level, so without this extra the documented
# `python deploy_to_ha.py` fails with ModuleNotFoundError on a fresh venv.
deploy = [
    "paramiko>=3.4",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".git",
    ".github",
    ".venv",
    "__pycache__",
    "*.egg-info",
    "_local_archive",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long — handled by formatter
]
[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Home Assistant 2026.x requires Python >= 3.14, and its own sources use 3.12+
# syntax (e.g. PEP 695 `type` statements), so mypy must target 3.14 to be able
# to follow imports into homeassistant/.
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous.*",
    "aiohttp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.coverage.run]
source = ["custom_components"]
omit = ["tests/*"]
