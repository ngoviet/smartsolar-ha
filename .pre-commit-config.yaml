repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev at or above the `ruff` floor in pyproject.toml, and in step
    # with the version CI installs. v0.4.0 could not even parse the repository's
    # own config (`target-version = "py314"` is an unknown variant for it) and it
    # predates PEP 758, so the hook failed with exit 2 on every commit.
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
